<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening in MiniShell...</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #f2f2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 { font-size: 22px; margin: 12px 0 8px; color: #1c1c1e; }
    p { color: #8e8e93; font-size: 15px; margin: 0 0 24px; }
    .btn {
      display: block;
      background: #007aff;
      color: white;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .icon { font-size: 48px; }
    .status { font-size: 13px; color: #8e8e93; margin-top: 8px; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">🧩</div>
  <h1>Open in MiniShell</h1>
  <p id="appname">Loading your app...</p>
  <a class="btn" id="openBtn" href="#">Open in MiniShell</a>
  <div class="status" id="status">Tap the button above on your iPhone</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name') || 'My App';
  const html = params.get('html') || '';

  document.getElementById('appname').textContent = '📦 ' + name;
  document.getElementById('openBtn').textContent = 'Open "' + name + '" in MiniShell';

  const deeplink = 'minishell://create?name=' + encodeURIComponent(name) + '&html=' + encodeURIComponent(html);
  document.getElementById('openBtn').href = deeplink;

  // Auto-redirect on mobile
  if (/iPhone|iPad/.test(navigator.userAgent)) {
    setTimeout(() => {
      window.location.href = deeplink;
      setTimeout(() => {
        document.getElementById('status').textContent = 'If MiniShell did not open, tap the button above.';
      }, 2000);
    }, 800);
  }
</script>
</body>
</html>
